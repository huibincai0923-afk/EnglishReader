<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Reader</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">📖 English Reader</div>
  <label class="file-btn">Import EPUB<input id="epubInput" type="file" accept=".epub" hidden></label>
  <div class="book-meta"><b id="bookTitle">No book loaded</b><span id="bookAuthor"></span></div>
  <select id="levelSelect" class="control" title="Vocabulary level">
    <option value="B2">🟨 B2+ words & phrases</option>
    <option value="C1">🟨 C1 only</option>
  </select>
  <select id="fontSize" class="control" title="Font size">
    <option value="18">18px</option><option value="20">20px</option><option value="22">22px</option>
    <option value="24">24px</option><option value="26">26px</option><option value="28">28px</option>
    <option value="30">30px</option><option value="34">34px</option><option value="38">38px</option>
    <option value="42">42px</option>
  </select>
  <button id="fontDown" class="control">A−</button><button id="fontUp" class="control">A+</button>
  <button id="openVocab" class="control">📚 Vocabulary</button>
  <button id="openNotes" class="control">📝 Notes</button>
  <button id="openStats" class="control">📊 Reading</button>
  <button id="marginBtn" class="control">↔ Margins</button>
  <button id="theme" class="control">🌙</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="side-title">Contents</div>
    <nav id="toc"><small>Import an EPUB to see chapters.</small></nav>
    <div class="legend">
      <div><i class="swatch word"></i> B2+ word</div>
      <div><i class="swatch phrase"></i> B2+ phrase</div>
      <hr>
      <div class="mark-row"><button class="mark-btn mark-red" data-mark="red">红</button><button class="mark-btn mark-yellow" data-mark="yellow">黄</button><button class="mark-btn mark-blue" data-mark="blue">蓝</button><button class="mark-btn mark-purple" data-mark="purple">紫</button><button class="mark-btn mark-green" data-mark="green">绿</button></div>
      <small>Drag-select text to mark it.</small>
    </div>
  </aside>

  <main id="main">
    <div id="viewer"><div class="empty">Import an EPUB to start reading.</div></div>
    <div class="bottom">
      <button id="prev" disabled>← Previous</button>
      <span id="location">0%</span>
      <div class="progress"><span id="progressFill"></span></div>
      <button id="next" disabled>Next →</button>
    </div>
  </main>
</div>

<div id="popup" class="popup hidden">
  <button id="close" class="x">×</button>
  <div id="word" class="popup-word"></div>
  <div id="pron" class="popup-meta"></div>
  <div id="meaning" class="popup-meaning"></div>
  <div class="popup-actions"><button id="save">⭐ Add to vocabulary</button></div>
</div>
<div id="toast" class="toast hidden"></div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <b id="drawerTitle">Vocabulary</b><button id="drawerClose">×</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</div>
<script src="app.js?v=61"></script>
</body>
</html>
